name: Android CI

on:
  push:
    branches: [ main, "ccr-**" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testBasicDebugUnitTest :app:testFullDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintBasicDebug :app:lintFullDebug
      - name: Room schemas committed
        run: git diff --exit-code app/schemas
      - name: Build debug APK
        run: ./gradlew :app:assembleBasicDebug :app:assembleFullDebug
      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleBasicRelease :app:assembleFullRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk

  # Things the JVM tests can't check: SQLCipher, the Android Keystore, the lock screen on a device.
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew :app:assembleFullDebug :app:assembleFullDebugAndroidTest
      - name: Run device tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedFullDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: app/build/reports/androidTests/
