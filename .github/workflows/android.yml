name: Android CI

on:
  push:
    branches: [ main, "ccr-**" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testFullDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintFullDebug
      - name: Build debug APK
        run: ./gradlew :app:assembleBasicDebug :app:assembleFullDebug
      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleBasicRelease :app:assembleFullRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
